[project]
name = "twitter-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Sverdlov", email = "marksve039@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "openai-whisper>=20250625",
    "typer>=0.27.1",
]

[project.scripts]
download-tweet = "twitter_downloader:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
